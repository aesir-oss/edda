[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "edda"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[dependencies]
rust = ">=1.90"
python = ">=3.12,<3.15"
nodejs = ">=22"
maturin = ">=1.15.0,<2"
fastapi = ">=0.156.4,<0.157"
uvicorn = ">=0.54.0,<0.55"
structlog = ">=26.1.0,<27"
pydantic = ">=2.14.1,<3"
# `maturin develop` looks for pip even with --skip-install; nothing installs with it.
pip = ">=26.2.2,<27"
anthropic = ">=2.1.0,<3"
httpx = ">=0.28.1,<0.29"

# The Python package and its native module (crates/edda-py) are built from this repository by maturin, never
# resolved from PyPI: an unrelated `edda` exists there.
[pypi-dependencies]
edda = { path = ".", editable = true }

[pypi-options]
no-build-isolation = ["edda"]

[tasks]
# `pixi install` builds the native module once; this rebuilds it in place after a Rust change.
native = { cmd = "maturin develop --skip-install", inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/**/*.rs",
  "crates/**/Cargo.toml",
] }
web-install = { cmd = "npm ci --no-audit --no-fund", cwd = "web", inputs = [
  "web/package.json",
  "web/package-lock.json",
], outputs = [
  "web/node_modules/.package-lock.json",
] }

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
ruff = "*"
httpx = "*"
pre-commit = "*"
cargo-llvm-cov = "*"
git-cliff = "*"
pre-commit-hooks = ">=6.0.0,<7"
act = ">=0.2.89,<0.3"

[feature.dev.tasks]
bootstrap = { cmd = "pre-commit install --hook-type pre-commit --hook-type commit-msg", depends-on = [
  "web-install",
] }

fmt-rust = "cargo fmt --all"
fmt-py = "ruff format ."
fmt-web = { cmd = "npm run fmt", cwd = "web", depends-on = ["web-install"] }
fmt = { depends-on = ["fmt-rust", "fmt-py", "fmt-web"] }

lint-rust = "cargo clippy --workspace --all-targets -- -D warnings"
lint-py = "ruff check ."
lint-web = { cmd = "npm run lint", cwd = "web", depends-on = ["web-install"] }
lint = { depends-on = ["lint-rust", "lint-py", "lint-web"] }

check-py = { cmd = "mypy", depends-on = ["native"] }
check-web = { cmd = "npm run typecheck", cwd = "web", depends-on = ["web-install"] }
check = { depends-on = ["check-py", "check-web"] }

test-rust = "cargo test --workspace --exclude edda-py"
test-py = { cmd = "pytest tests/unit", depends-on = ["native"] }
test-web = { cmd = "npm test", cwd = "web", depends-on = ["web-install"] }
test = { depends-on = ["test-rust", "test-py", "test-web"] }
test-integration = { cmd = "pytest tests/integration", depends-on = ["native"] }

# edda-py is a thin PyO3 layer that cargo cannot test without an interpreter; the Python suite covers it.
cov-rust = "cargo llvm-cov --workspace --exclude edda-py --all-targets --fail-under-lines 90"
cov-py = { cmd = "pytest tests --cov=edda --cov-report=term-missing --cov-fail-under=90", depends-on = [
  "native",
] }
cov-web = { cmd = "npm run cov", cwd = "web", depends-on = ["web-install"] }
cov = { depends-on = ["cov-rust", "cov-py", "cov-web"] }

build-rust = "cargo build --workspace"
build-py = "maturin build --release --out dist"
build-web = { cmd = "npm run build", cwd = "web", depends-on = ["web-install"] }
build = { depends-on = ["build-rust", "build-py", "build-web"] }

# The API's OpenAPI schema and the web app's TypeScript types generated from it; a test fails when either is stale.
gen-api = { cmd = "python -m edda.api.openapi web/openapi.json && npm --prefix web run gen-api", depends-on = [
  "native",
  "web-install",
] }

api-drift = { cmd = "git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts", depends-on = [
  "gen-api",
] }

# CI locally with nektos/act, in Docker. The image is pinned here so act never stops to ask for one; extra arguments
# pass through, for example `pixi run act -j unit --matrix python-version:3.14`.
act = { cmd = "act --container-architecture linux/amd64 -P ubuntu-latest=catthehacker/ubuntu:act-latest", description = "run the CI workflow locally in Docker" }

# Downloads a known local model (edda.llm.models) to ~/.cache/edda/models and checks its SHA-256.
llm-smoke = { args = [
  { arg = "vault", default = "examples/vault" },
  { arg = "provider", default = "" },
], cmd = "python -m edda.llm.smoke {{ vault }} {{ provider }}" }
llm-fetch = { args = [{ arg = "name", default = "qwen3-14b" }], cmd = "python -m edda.llm.models {{ name }}" }

changelog = "git cliff -o CHANGELOG.md"
pre-commit-run = "pre-commit run --all-files"
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "api-drift", "cov"] }

# The API on :8000 (uvicorn's default) and the Vite dev server on :5173 (Vite's), which proxies /api to the API.
# Both are arguments: `pixi run dev 8765 5199`. EDDA_VAULT picks the vault.
dev = { args = [
  { arg = "api_port", default = "8000" },
  { arg = "web_port", default = "5173" },
], cmd = "uvicorn edda.api.app:create_app --factory --reload --port {{ api_port }} & EDDA_API=http://127.0.0.1:{{ api_port }} npm --prefix web run dev -- --port {{ web_port }} --strictPort", depends-on = [
  "native",
  "web-install",
], env = { EDDA_VAULT = "$PIXI_PROJECT_ROOT/examples/vault" } }

[feature.py314.dependencies]
python = "3.14.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.bmad.dependencies]
bmad-method = ">=6.12.4,<7"
python = "3.14.*"
"ruamel.yaml" = ">=0.19.1,<0.20"

[feature.bmad.tasks]
# BMad Method from conda-forge. tea, bmb and cis are external modules the installer fetches at their latest stable
# tags. Re-running it updates the install and keeps earlier answers as defaults.
bmad-install = { cmd = """
bmad-method install -y \
  --directory . \
  --tools claude-code \
  --modules bmm,tea,bmb,cis \
  --channel stable \
  --output-folder _bmad-output \
  --set tea.ci_platform=github-actions \
  --set tea.test_stack_type=fullstack
""", description = "install or update BMad Method (core, bmm, tea, bmb, cis) for Claude Code" }

[feature.llm.dependencies]
"llama.cpp" = ">=11351"

# The local model server: llama.cpp's llama-server with its OpenAI-compatible API on 127.0.0.1, every layer on the
# GPU, and tool calling through the model's chat template. Weights come from `pixi run llm-fetch`. Arguments, in
# order: model file, port, context size, e.g. `pixi run -e llm llm-serve Qwen3-14B-Q4_K_M.gguf 8081 16384`.
[feature.llm.tasks]
llm-serve = { args = [
  { arg = "model", default = "Qwen3-14B-Q4_K_M.gguf" },
  { arg = "port", default = "8080" },
  { arg = "ctx", default = "32768" },
], cmd = "llama-server -m $HOME/.cache/edda/models/{{ model }} --host 127.0.0.1 --port {{ port }} -c {{ ctx }} -ngl 99 -fa on --jinja --alias {{ model }}" }

[environments]
default = ["py314", "dev"]
py313 = ["py313", "dev"]
py312 = ["py312", "dev"]
bmad = { features = ["bmad"], no-default-feature = true }
llm = { features = ["llm"], no-default-feature = true }
