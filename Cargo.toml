[workspace]
resolver = "3"
members = ["crates/*"]

# Edda is deployed from this repository and never published. crates.io has unrelated `edda`, `edda-core` and
# `edda-store` crates, so every crate sets `publish.workspace = true` and siblings are depended on by path only.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/aesir-oss/edda"
publish = false

[workspace.dependencies]
edda-index = { path = "crates/edda-index" }
edda-journal = { path = "crates/edda-journal" }
edda-store = { path = "crates/edda-store" }

hex = "0.4.3"
jiff = "0.2.38"
indexmap = { version = "2.14", features = ["serde"] }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
similar = "3.2"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "stopwords", "lz4-compression", "stemmer"] }
tempfile = "3.27"
thiserror = "2.0.21"
toml = "1.1"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
