[vault]
title = "Edda example vault"
types = ["Concept", "Paper", "Person", "Project"]

# Which model each job uses: an endpoint below, or "anthropic". "local" is the default: a model server on this machine
# (llama.cpp's llama-server, Ollama, mlx-lm ...), free, and nothing leaves the machine. "nvidia" is NVIDIA's hosted
# Nemotron and "anthropic" is Claude; both need your own key in the environment and send sources off the machine.
# Keys never go in this file.
[llm]
ingest = "local"
query = "local"
lint = "local"
research = "local"
summary = "local"

# OpenAI-compatible endpoints. api_key_env names the environment variable that holds the endpoint's key.
[llm.endpoints.local]
base_url = "http://127.0.0.1:8080/v1"
model = "local"
timeout_seconds = 600

[llm.endpoints.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
model = "nvidia/nemotron-3-super-120b-a12b"
api_key_env = "NVIDIA_API_KEY"
timeout_seconds = 300

# The Claude model each job uses when it is set to "anthropic".
[llm.anthropic]
ingest = "claude-sonnet-5-5"
query = "claude-sonnet-5-5"
lint = "claude-opus-5-5"
research = "claude-opus-5-5"
summary = "claude-haiku-5-5"
fallbacks = true

# Tokens of context each job may pack into a prompt, and the longest reply it may ask for. These fit a local model
# served with a 32k-token context (`pixi run -e llm llm-serve`); raise them for jobs set to "anthropic".
[budgets]
ingest = 20000
query = 16000
lint = 24000
research = 24000
max_output_tokens = 8000

[drivers.web]
timeout_seconds = 20
max_bytes = 5000000

[drivers.pdf]
library = "pypdf"
